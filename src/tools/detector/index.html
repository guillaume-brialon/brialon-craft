<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Détecteur de mise en arrière-plan</title>
	<link href='https://fonts.googleapis.com/css?family=Open+Sans:300' rel='stylesheet' type='text/css'>
	<style>
		body {
			font-family: 'Open Sans', sans-serif;
			font-size: 2em;
		}
	</style>

	<script>
		function testWake(delay) {
			return new Promise(function (resolve) {
				var startTime = Date.now()
				window.setTimeout(function () {
					var stopTime = Date.now()
					var overhead = stopTime - startTime - delay
					resolve(overhead / delay)
				}, delay)
			})
		}

		function checkOverhead(value) {
			if(value > 1){
				alert('Mise en arrière-plan détectée à ' + new Date().toTimeString())
			}
			return Promise.resolve()
		}

		function loop() {
			testWake(100).then(checkOverhead).then(loop)
		}

		loop()
	</script>

</head>
<body>
<p>
	Je détecte si vous me mettez en arrière-plan ...
</p>
</body>
</html>
